# Stage 0: database for local development, reachable from this machine only.
# A project name of its own, so it never clashes with an installation
# (deploy/compose.yaml is project "paperus").
name: paperus-dev

services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: paperus
      POSTGRES_PASSWORD: paperus
      POSTGRES_DB: paperus
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "paperus"]
      interval: 2s
      retries: 15

  # Machine learning service; for development usually run with
  # `uv run paperus-ml` instead. Start with: docker compose --profile ml up -d
  ml:
    profiles: ["ml"]
    build: ./ml
    environment:
      PAPERUS_ML_TOKEN: ${PAPERUS_ML_TOKEN:-}
      PAPERUS_ML_PRELOAD: ${PAPERUS_ML_PRELOAD:-[]}
    ports:
      - "127.0.0.1:3003:3003"
    volumes:
      # A folder on the host (owned by uid 1000).
      - ${MODEL_CACHE_LOCATION:-./data/model-cache}:/cache

volumes:
  db-data:
    # Kept from before the project was renamed.
    name: paperus_db-data
