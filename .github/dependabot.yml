# Weekly update pull requests for everything paperus depends on. Minor and
# patch updates come grouped per kind; major ones one by one. New releases
# wait a week first (cooldown), so a broken or malicious release has time
# to be noticed. Security updates come at once, regardless of the schedule.
version: 2

updates:
  - package-ecosystem: uv
    directories: ["/server", "/ml"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories: ["/web", "/client"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      # TypeScript 7 (the native compiler) is not supported by svelte-check
      # yet; move by hand when it is.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # marked-katex-extension accepts katex below 0.19 only (5.1.13).
      - dependency-name: katex
        versions: [">=0.19.0"]
    groups:
      npm:
        update-types: [minor, patch]

  # Base images: python, node and uv (Dockerfiles).
  - package-ecosystem: docker
    directories: ["/", "/ml"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      # Tags like node:26-slim are pushed again every few days (fixes, a new
      # Debian base), so a cooldown would skip exactly the maintained ones.
      exclude: [node, python]
    ignore:
      # Node's major versions (only even ones become LTS) by hand.
      - dependency-name: node
        update-types: [version-update:semver-major]
      # Python's versions (3.14 → 3.15) by hand too: new ones lack wheels
      # for a while (onnxruntime had none for 3.15 a month after it).
      - dependency-name: python
        update-types: [version-update:semver-minor]
    groups:
      images:
        update-types: [minor, patch]

  # Postgres (compose files).
  - package-ecosystem: docker-compose
    directories: ["/", "/deploy"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      hooks:
        patterns: ["*"]
