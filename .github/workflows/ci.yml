name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit (all hooks, all files)
    runs-on: ubuntu-latest
    env:
      # Run in their own jobs below (they need the dependencies installed).
      SKIP: ty,ty-ml,svelte-check,tsc-extension
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag; pin an exact version
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      # For the prettier hook.
      - run: npm ci
        working-directory: web
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure

  server:
    name: Server (ruff, ty, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: paperus
          POSTGRES_PASSWORD: paperus
          POSTGRES_DB: paperus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paperus"
          --health-interval 2s
          --health-retries 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag; pin an exact version
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check src tests
      - run: uv run pytest -q

  ml:
    name: ML service (ruff, ty, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag; pin an exact version
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check src tests
      - run: uv run pytest -q

  web:
    name: Website (prettier, svelte-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build

  client:
    name: TypeScript client (generate, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run

  extension:
    name: Browser extension (tsc, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  images:
    name: Container images (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - uses: docker/build-push-action@v7
        with:
          context: ml
          push: false
          cache-from: type=gha,scope=ml
          cache-to: type=gha,mode=max,scope=ml
      # The variant for NVIDIA GPUs (paperus-ml:<version>-cuda).
      - uses: docker/build-push-action@v7
        with:
          context: ml
          push: false
          build-args: DEVICE=cuda
          cache-from: type=gha,scope=ml-cuda
          cache-to: type=gha,mode=max,scope=ml-cuda
