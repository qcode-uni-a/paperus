name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit (all hooks, all files)
    runs-on: ubuntu-latest
    env:
      # Run in their own jobs below (they need the dependencies installed).
      SKIP: ty,ty-ml,svelte-check,tsc-extension
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag; pin an exact version
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      # For the prettier hook.
      - run: npm ci
        working-directory: web
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure

  server:
    name: Server (ruff, ty, pytest)
    runs-on: ubuntu-latest
    # Codecov takes the coverage on GitHub's word (OIDC), no token.
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: paperus
          POSTGRES_PASSWORD: paperus
          POSTGRES_DB: paperus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paperus"
          --health-interval 2s
          --health-retries 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag; pin an exact version
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check src tests
      - run: uv run pytest -q -n auto --cov --cov-fail-under=95 --cov-report=term --cov-report=xml
      - uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: server/coverage.xml
          flags: server

  ml:
    name: ML service (ruff, ty, pytest)
    runs-on: ubuntu-latest
    # Codecov takes the coverage on GitHub's word (OIDC), no token.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag; pin an exact version
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check src tests
      - run: uv run pytest -q --cov --cov-fail-under=95 --cov-report=term --cov-report=xml
      - uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ml/coverage.xml
          flags: ml

  web:
    name: Website (prettier, svelte-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build

  e2e:
    name: End-to-end (Playwright, ${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # WebKit: Safari's engine, and the apps' on macOS, iOS and Linux.
        browser: [chromium, webkit]
    env:
      PAPERUS_E2E_BROWSER: ${{ matrix.browser }}
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: paperus
          POSTGRES_PASSWORD: paperus
          POSTGRES_DB: paperus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paperus"
          --health-interval 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag; pin an exact version
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - run: uv sync --frozen
        working-directory: server
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: e2e
      - run: npm run check
        working-directory: e2e
      # Builds the website, then starts paperus (scripts/serve.sh) and tests.
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report-${{ matrix.browser }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/server-logs/
          retention-days: 7

  update:
    name: Update from the last release (Docker Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag; pin an exact version
      - uses: docker/setup-buildx-action@v4
      # This version's server image (the images job's cache), loaded for compose.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ghcr.io/qcode-uni-a/paperus-server:ci
          cache-from: type=gha,scope=server
      # The last release with a small library, updated to it, checked.
      - run: deploy/update-test/run.sh ci release

  client:
    name: TypeScript client (generate, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run

  extension:
    name: Browser extension (tsc, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  app:
    name: App (rustfmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v7
      # What Tauri builds on under Linux (WebKitGTK).
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  app-e2e:
    name: App end-to-end (tauri-driver)
    runs-on: ubuntu-latest
    # A step that hangs fails here, with its logs, not after hours.
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: paperus
          POSTGRES_PASSWORD: paperus
          POSTGRES_DB: paperus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paperus"
          --health-interval 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag; pin an exact version
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev webkitgtk-webdriver xvfb
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: e2e
      - run: uv sync --frozen
        working-directory: server
      - run: npm ci && npm run build
        working-directory: web
      - run: cargo build --locked
        working-directory: app/src-tauri
      - run: cargo install tauri-driver --locked
      # The app, driven through WebDriver, against the e2e tests' paperus.
      - run: bash app/tests/run.sh

  images:
    name: Container images (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - uses: docker/build-push-action@v7
        with:
          context: ml
          push: false
          cache-from: type=gha,scope=ml
          cache-to: type=gha,mode=max,scope=ml
      # The variant for NVIDIA GPUs (paperus-ml:<version>-cuda).
      - uses: docker/build-push-action@v7
        with:
          context: ml
          push: false
          build-args: DEVICE=cuda
          cache-from: type=gha,scope=ml-cuda
          cache-to: type=gha,mode=max,scope=ml-cuda
