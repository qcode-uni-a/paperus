name: Dependency audit

# Known vulnerabilities in what paperus ships (docs/security.md): the
# server's and the ML service's Python packages, the runtime npm packages
# of the website, the extension, the client and the app, the app's Rust
# crates. Weekly and by hand; not on every push (an advisory published
# today should not fail yesterday's change).
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python (pip-audit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [server, ml]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag; pin an exact version
      - run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -q > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --disable-pip --no-deps
        working-directory: ${{ matrix.project }}

  npm:
    name: npm (npm audit, runtime)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [web, extension, client, app]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # What reaches people's browsers and computers; the build tools'
      # advisories are read when updating them.
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: ${{ matrix.project }}

  rust:
    name: Rust (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: app/src-tauri
