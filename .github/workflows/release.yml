name: Release

# For a tag "v1.2.3": test, then publish container images (ghcr.io), Python
# packages (PyPI), the TypeScript client (npm) and the browser extension
# (Firefox, Chrome), then the GitHub release. Each of these only runs once
# switched on with its repository variable (PUBLISH_PYPI, PUBLISH_NPM,
# PUBLISH_FIREFOX, PUBLISH_CHROME; see docs/operations.md, "Releases").
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  versions:
    name: Tag matches the package versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare
        run: |
          version="${GITHUB_REF_NAME#v}"
          status=0
          for file in server/pyproject.toml ml/pyproject.toml; do
            found=$(grep -m1 '^version = ' "$file" | cut -d'"' -f2)
            [ "$found" = "$version" ] || { echo "::error file=$file::version $found, tag $version"; status=1; }
          done
          for file in web/package.json client/package.json extension/package.json; do
            found=$(node -p "require('./$file').version")
            [ "$found" = "$version" ] || { echo "::error file=$file::version $found, tag $version"; status=1; }
          done
          exit $status

  images:
    name: Image ${{ matrix.image }}
    needs: [ci, versions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: paperus-server
            context: .
          - image: paperus-ml
            context: ml
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=raw,value=release
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  pypi:
    name: PyPI (${{ matrix.package }})
    needs: [ci, versions]
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    # Trusted publishing: pypi.org knows this repository, workflow and
    # environment; no password is stored here. One environment per package,
    # as PyPI takes each repository/workflow/environment once.
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: paperus
            folder: server
            environment: pypi
          - package: paperus-ml
            folder: ml
            environment: pypi-ml
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag; pin an exact version
      - run: cd ${{ matrix.folder }} && uv build -o ../dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  npm:
    name: npm (paperus)
    needs: [ci, versions]
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      # Trusted publishing once it is set up on npmjs.com; the first release
      # (before the package exists) needs an NPM_TOKEN secret instead.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # The stores only get a new version when the extension changed since the
  # previous release (each one goes through review).
  extension:
    name: Extension changed?
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - id: check
        run: .github/scripts/extension-changed.sh

  firefox:
    name: Firefox add-on (addons.mozilla.org)
    needs: [ci, versions, extension]
    if: vars.PUBLISH_FIREFOX == 'true' && needs.extension.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: firefox
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci && npm run build && npm run source
      # Handed in with its source for Mozilla's review; listed once approved
      # (not waited for here).
      - run: >
          npx --yes web-ext@8.10.0 sign --channel listed
          --source-dir dist/firefox --artifacts-dir dist/signed
          --upload-source-code "dist/paperus-extension-source-${GITHUB_REF_NAME#v}.zip"
          --amo-metadata amo-metadata.json --approval-timeout 0
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}

  chrome:
    name: Chrome extension (Chrome Web Store)
    needs: [ci, versions, extension]
    if: vars.PUBLISH_CHROME == 'true' && needs.extension.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: chrome
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci && npm run build
      - id: google
        run: node "$GITHUB_WORKSPACE/.github/scripts/google-token.mjs"
        env:
          CHROME_SERVICE_ACCOUNT_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_KEY }}
      # Upload, wait until the store has processed it, then hand it in for
      # review; it is published once approved (not waited for here).
      - run: |
          set -euo pipefail
          api=https://chromewebstore.googleapis.com
          item="publishers/$PUBLISHER/items/$ITEM"
          auth="Authorization: Bearer $TOKEN"
          curl --fail-with-body -sS -H "$auth" -X POST \
            -T "dist/paperus-chrome-${GITHUB_REF_NAME#v}.zip" \
            "$api/upload/v2/$item:upload" | tee upload.json
          state=$(jq -r .uploadState upload.json)
          for _ in $(seq 60); do
            case "$state" in
              SUCCEEDED) break ;;
              *IN_PROGRESS) sleep 10
                state=$(curl --fail-with-body -sS -H "$auth" "$api/v2/$item:fetchStatus" |
                  jq -r .lastAsyncUploadState) ;;
              *) echo "Upload failed: $state"; exit 1 ;;
            esac
          done
          test "$state" = SUCCEEDED
          curl --fail-with-body -sS -H "$auth" -H "Content-Type: application/json" \
            -X POST -d '{}' "$api/v2/$item:publish"
        env:
          TOKEN: ${{ steps.google.outputs.token }}
          PUBLISHER: ${{ vars.CHROME_PUBLISHER_ID }}
          ITEM: ${{ vars.CHROME_ITEM_ID }}

  release:
    name: GitHub release
    needs: [images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      # The browser extension (to load unpacked, or hand in at the stores)
      # and its source, which Firefox's review needs.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci && npm run build && npm run source
        working-directory: extension
      - run: >
          gh release create "$GITHUB_REF_NAME" --title "paperus $GITHUB_REF_NAME"
          --notes-file notes.md extension/dist/paperus-*.zip
        env:
          GH_TOKEN: ${{ github.token }}
