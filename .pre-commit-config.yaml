# Copied from Procrastinate as is.
exclude: ^server/src/paperus/migrations/procrastinate_.*\.sql$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run --directory server ty check src tests
        language: system
        files: ^server/.*\.py$
        pass_filenames: false
      - id: ty-ml
        name: ty (ml)
        entry: uv run --directory ml ty check src tests
        language: system
        files: ^ml/.*\.py$
        pass_filenames: false
      - id: prettier
        name: prettier (web)
        entry: npm --prefix web run lint
        language: system
        files: ^web/
        pass_filenames: false
      - id: svelte-check
        name: svelte-check (web)
        entry: npm --prefix web run check
        language: system
        files: ^web/
        pass_filenames: false
