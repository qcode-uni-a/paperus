<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>paperus</title>
		<link rel="stylesheet" href="options.css" />
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body>
		<main>
			<div id="flow" class="flow" data-stage="reading" aria-hidden="true">
				<span class="node">
					<img id="site-icon" alt="" />
					<svg id="site-globe" viewBox="0 0 24 24" class="you" hidden>
						<circle cx="12" cy="12" r="9" />
						<path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18" />
					</svg>
					<small id="site-name">the page</small>
				</span>
				<span class="track"></span>
				<span class="node">
					<svg viewBox="0 0 24 24" class="you"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" /></svg>
					<small>you</small>
				</span>
				<span class="track"></span>
				<span class="node"><img src="icons/icon-32.png" alt="" /><small>paperus</small></span>
				<svg viewBox="0 0 24 28" class="pdf">
					<path d="M3 1h12l6 6v20H3z" />
					<path d="M15 1v6h6" />
					<text x="12" y="21" text-anchor="middle">PDF</text>
				</svg>
			</div>
			<p id="state" class="state" role="status">Reading the page…</p>
			<p id="title" class="title" hidden></p>
			<p id="detail" class="muted small" hidden></p>
			<label id="owner-field" hidden
				>Saved to
				<select id="owner"></select>
			</label>
			<section id="supplements" hidden>
				<p class="list-head small">
					<span id="supplements-head" class="muted">Supplementary material</span>
				</p>
				<ul id="supplement-list" class="rows"></ul>
				<button id="add-supplements" class="primary" hidden>Add to this paper</button>
			</section>
			<p class="more small">
				<button id="show-list" class="text" hidden></button>
				<button id="again" class="text" hidden title="Fetch its PDF and supplements again">
					Save again
				</button>
			</p>
			<section id="list" hidden>
				<p id="list-title" class="title"></p>
				<p class="list-head small">
					<span id="list-count" class="muted"></span>
					<button id="all" class="text">All</button>
					<button id="none" class="text">None</button>
				</p>
				<ul id="listed" class="rows"></ul>
				<label id="list-owner-field" hidden
					>Save to
					<select id="list-owner"></select>
				</label>
				<button id="save-listed" class="primary">Save</button>
			</section>
			<button id="allow" class="primary" hidden>Allow paperus on all websites</button>
			<button id="connect" class="primary" hidden>Connect paperus</button>
			<p class="links small">
				<a id="open" target="_blank" hidden>Open in paperus</a>
				<a id="settings" href="#">Settings</a>
				<span id="version" class="muted"></span>
			</p>
		</main>
		<script src="popup.js" type="module"></script>
	</body>
</html>
