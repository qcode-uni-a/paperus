[project]
name = "paperus"
version = "0.1.0"
description = "Self-hosted research library for groups"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "paperus contributors" }]
keywords = ["research", "library", "papers", "semantic search", "self-hosted"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "beautifulsoup4>=4.15",
    "boto3>=1.43.124",
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "markdownify>=1.2.3",
    "mcp>=2.3.0,<3",
    "numpy>=2.3",
    "pgvector>=0.5.1",
    "procrastinate>=3.10,<3.11",  # schema frozen in src/paperus/migrations/
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.8",
    "pybtex>=0.26.1",
    "pydantic-settings>=2.16.2",
    "pylatexenc>=2.11",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.33",
    "rdflib>=7.6.0",
    "rispy>=0.10.0",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/qcode-uni-a/paperus"
Source = "https://github.com/qcode-uni-a/paperus"
Issues = "https://github.com/qcode-uni-a/paperus/issues"

[project.scripts]
paperus = "paperus.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "moto[s3]>=5.2.5",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
    "ty>=0.0.97",
    "types-boto3[s3]>=1.43.123",
]

[tool.coverage.run]
source = ["paperus"]
# The PDF helper processes and CLI runs count too.
patch = ["subprocess"]
concurrency = ["thread", "multiprocessing"]
parallel = true

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_also = ['if __name__ == "__main__":']
