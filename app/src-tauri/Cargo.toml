[package]
name = "paperus-app"
version = "0.0.29"
description = "paperus as an app: a paperus server's website in a window of its own"
authors = ["paperus contributors"]
license = "Apache-2.0"
repository = "https://github.com/qcode-uni-a/paperus"
edition = "2024"
publish = false

[lib]
name = "paperus_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json"] }
url = "2"
sha2 = "0.11.1"
base64 = "0.23"
getrandom = "0.4"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tar = "0.4"
flate2 = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
keyring = { version = "4", features = ["apple-native-keyring-store"] }
tauri-plugin-dialog = "2"
